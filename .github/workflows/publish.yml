# Auto-publish to npm when a version tag (v*) is pushed.
#
# Auth: OIDC "trusted publishing" — NO npm token or GitHub secret. The job
# mints a short-lived, workflow-scoped credential at run time via the
# `id-token: write` permission. Nothing to rotate, expire, or leak.
#
# One-time setup (npmjs.com → @avinash-singh-io/engram → Settings →
# "Trusted Publisher" → GitHub Actions):
#   Organization or user: avinash-singh-io
#   Repository:           engram
#   Workflow filename:    publish.yml
#   Environment:          (leave blank)
#   Allowed actions:      npm publish
#
# Config mirrors the official npm example (https://docs.npmjs.com/trusted-publishers/):
# setup-node@v6 + Node 24 ship npm >= 11.5.1, which the OIDC flow REQUIRES —
# an older npm ignores OIDC, uses setup-node's empty-token .npmrc, and fails
# with an anonymous E404. Caching is disabled for release builds; provenance
# is automatic (no --provenance flag needed).
#
# Release flow:
#   npm version patch|minor|major   # bumps package.json + creates the tag
#   git push --follow-tags          # pushes main + the tag -> triggers this
#
# The tag must equal the package.json version (guarded below), and `npm publish`
# runs the `prepublishOnly` gate (typecheck + lint + format + test + build)
# before anything is published.

name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache release builds (npm guidance)

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # OIDC trusted publishing: no NODE_AUTH_TOKEN. `npm publish` runs
      # prepublishOnly (npm run check) first; provenance is automatic.
      - run: npm publish --access public
