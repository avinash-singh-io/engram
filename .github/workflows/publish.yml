# Auto-publish to npm when a version tag (v*) is pushed.
#
# Auth: OIDC "trusted publishing" — NO npm token or GitHub secret. The job
# mints a short-lived, workflow-scoped credential at run time via the
# `id-token: write` permission. Nothing to rotate, expire, or leak.
#
# One-time setup (npmjs.com → @avinash-singh-io/engram → Settings →
# "Trusted Publisher" → GitHub Actions):
#   Organization or user: avinash-singh-io
#   Repository:           engram
#   Workflow filename:    publish.yml
#   Environment:          (leave blank)
#   Allowed actions:      npm publish
#
# IMPORTANT — do NOT add `registry-url` to setup-node. With registry-url,
# setup-node writes an .npmrc containing a DUMMY `_authToken=XXXXX-...`; npm
# then authenticates with that bogus token (E404) and never falls back to
# OIDC. The default registry (registry.npmjs.org) + OIDC is what we want.
# OIDC also requires npm >= 11.5.1 (upgraded below); provenance is automatic.
#
# Release flow:
#   npm version patch|minor|major   # bumps package.json + creates the tag
#   git push --follow-tags          # pushes main + the tag -> triggers this
#
# The tag must equal the package.json version (guarded below), and `npm publish`
# runs the `prepublishOnly` gate (typecheck + lint + format + test + build)
# before anything is published.

name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false # never cache release builds (npm guidance)

      # Trusted publishing needs npm >= 11.5.1; guarantee it (and log it).
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # OIDC trusted publishing: no token, no registry-url. `npm publish` runs
      # prepublishOnly (npm run check) first; provenance is automatic.
      - run: npm publish --access public
