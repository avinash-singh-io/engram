# Auto-publish to npm when a version tag (v*) is pushed.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   NPM_TOKEN = an npm **Automation** token (or a Granular token with
#   "Read and write" access to @avinash-singh-io/engram). Automation tokens
#   bypass 2FA, which CI requires. Create at npmjs.com → Access Tokens.
#
# Release flow:
#   npm version patch|minor|major   # bumps package.json + creates the tag
#   git push --follow-tags          # pushes main + the tag -> triggers this
#
# The tag must equal the package.json version (guarded below), and `npm publish`
# runs the `prepublishOnly` gate (typecheck + lint + format + test + build)
# before anything is published.

name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # `npm publish` runs prepublishOnly (npm run check) first, then publishes.
      # --provenance emits a signed build-provenance attestation (public repo).
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
